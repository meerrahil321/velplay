<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0f0f">
  <title>VELPLAY - Video Streaming Platform</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'><defs><linearGradient id='vg' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%23ff1744'/><stop offset='100%' stop-color='%23b71c1c'/></linearGradient></defs><rect width='28' height='28' rx='8' fill='url(%23vg)'/><path d='M6 7 L14 22 L22 7 L17.5 7 L14 14.5 L10.5 7 Z' fill='%23ffffff'/><polygon points='12.5,9.5 17,12.5 12.5,15.5' fill='%23ffd700'/></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark">

  <!-- TOPBAR -->
  <header id="topbar">
    <div class="topbar-left">
      <button id="sidebar-toggle" class="icon-btn" aria-label="Toggle Sidebar" title="Toggle Sidebar">
        <svg viewBox="0 0 24 24" class="svg-icon">
          <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
        </svg>
      </button>

      <a href="#/home" class="brand-logo" id="logo-link">
        <div class="logo-icon-badge">
          <svg viewBox="0 0 28 28" class="svg-icon vel-crest-icon">
            <defs>
              <linearGradient id="velGradTop" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ff1744"/>
                <stop offset="100%" stop-color="#b71c1c"/>
              </linearGradient>
            </defs>
            <rect width="28" height="28" rx="8" fill="url(#velGradTop)"/>
            <path d="M6 7 L14 22 L22 7 L17.5 7 L14 14.5 L10.5 7 Z" fill="#ffffff"/>
            <polygon points="12.5,9.5 17,12.5 12.5,15.5" fill="#ffd700"/>
          </svg>
        </div>
        <span class="logo-text"><span class="logo-white">VEL</span><span class="logo-red">PLAY</span></span>
      </a>
    </div>

    <div class="topbar-center">
      <form id="search-form" class="search-form" role="search" onsubmit="return false;">
        <div class="search-box">
          <input 
            type="text" 
            id="search-input" 
            placeholder="Search videos, categories, creators..." 
            autocomplete="off"
            spellcheck="false"
          >
          <button type="button" id="search-clear-btn" class="search-clear-btn" title="Clear search" aria-label="Clear search">
            <svg viewBox="0 0 24 24" class="svg-icon">
              <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
          </button>
        </div>
        <button type="submit" id="search-btn" class="search-submit-btn" title="Search" aria-label="Search">
          <svg viewBox="0 0 24 24" class="svg-icon">
            <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
        </button>
      </form>
      <!-- Quick suggestions dropdown container -->
      <div id="search-suggestions" class="search-suggestions hidden"></div>
    </div>

    <div class="topbar-right">
      <!-- Quick Upload Button -->
      <button id="quick-add-btn" class="icon-btn" aria-label="Add Video" title="Upload / Add Video">
        <svg viewBox="0 0 24 24" class="svg-icon">
          <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4zM14 13h-3v3H9v-3H6v-2h3V8h2v3h3v2z"/>
        </svg>
      </button>

      <!-- Notifications -->
      <div class="relative-container">
        <button id="notifications-btn" class="icon-btn" aria-label="Notifications" title="Notifications">
          <svg viewBox="0 0 24 24" class="svg-icon">
            <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/>
          </svg>
          <span id="notif-badge" class="badge-count">3</span>
        </button>
        <div id="notifications-dropdown" class="dropdown-panel hidden">
          <div class="dropdown-header">
            <h4>Notifications</h4>
            <button id="clear-notifications-btn" class="text-btn">Mark all read</button>
          </div>
          <div id="notifications-list" class="dropdown-list">
            <!-- Dynamically populated -->
          </div>
        </div>
      </div>

      <!-- Backup / Restore Button -->
      <button id="backup-nav-btn" class="icon-btn" aria-label="Backup and Restore" title="Backup / Restore Data">
        <svg viewBox="0 0 24 24" class="svg-icon">
          <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
        </svg>
      </button>

      <!-- Theme Switcher -->
      <button id="theme-toggle-btn" class="icon-btn" aria-label="Toggle Theme" title="Toggle Light / Dark Mode">
        <svg viewBox="0 0 24 24" class="svg-icon" id="theme-icon">
          <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0z"/>
        </svg>
      </button>

      <!-- Admin Panel Button -->
      <button id="admin-nav-btn" class="icon-btn admin-btn" aria-label="Admin Panel" title="Admin Panel">
        <svg viewBox="0 0 24 24" class="svg-icon">
          <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
        </svg>
        <span class="admin-badge-indicator"></span>
      </button>
    </div>
    <!-- Hidden file input for backup JSON restoration -->
    <input type="file" id="backup-file-input" accept=".json,application/json" style="display:none;">
  </header>

  <!-- SIDEBAR (collapsible desktop, drawer mobile) -->
  <aside id="sidebar">
    <div class="sidebar-section">
      <nav class="sidebar-nav">
        <a href="#/home" class="sidebar-link active" data-page="home">
          <svg viewBox="0 0 24 24" class="svg-icon">
            <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
          </svg>
          <span class="link-label">Home</span>
        </a>

        <a href="#/search" class="sidebar-link" data-page="search">
          <svg viewBox="0 0 24 24" class="svg-icon">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
          </svg>
          <span class="link-label">Explore</span>
        </a>

        <a href="#/favorites" class="sidebar-link" data-page="favorites">
          <svg viewBox="0 0 24 24" class="svg-icon">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
          <span class="link-label">Favorites</span>
        </a>

        <a href="#/history" class="sidebar-link" data-page="history">
          <svg viewBox="0 0 24 24" class="svg-icon">
            <path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
          </svg>
          <span class="link-label">History</span>
        </a>

        <a href="#/playlists" class="sidebar-link" data-page="playlists">
          <svg viewBox="0 0 24 24" class="svg-icon">
            <path d="M4 10h12v2H4zm0-4h12v2H4zm0 8h8v2H4zm10 0v6l5-3z"/>
          </svg>
          <span class="link-label">Playlists</span>
        </a>

        <a href="#/admin" class="sidebar-link" data-page="admin">
          <svg viewBox="0 0 24 24" class="svg-icon">
            <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
          </svg>
          <span class="link-label">Admin Panel</span>
        </a>
      </nav>
    </div>

    <div class="sidebar-divider"></div>

    <div class="sidebar-section">
      <h3 class="sidebar-heading">Categories</h3>
      <div class="sidebar-categories" id="sidebar-categories">
        <!-- Rendered via JS -->
      </div>
    </div>

    <div class="sidebar-footer">
      <p class="brand-tagline">VELPLAY Video Hub</p>
      <p class="version-tag">Pure Vanilla JS • LocalStorage</p>
    </div>
  </aside>

  <!-- MOBILE SIDEBAR OVERLAY -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <!-- MAIN DYNAMIC CONTENT AREA -->
  <main id="main-content">
    <!-- Pages rendered dynamically by JS -->
  </main>

  <!-- THEATRE / FULLSCREEN PLAYER OVERLAY WRAPPER (required by layout spec) -->
  <div id="video-player-overlay" class="player-overlay-portal hidden"></div>

  <!-- MOBILE BOTTOM NAVIGATION -->
  <nav id="bottom-nav">
    <a href="#/home" class="bottom-nav-item active" data-page="home">
      <svg viewBox="0 0 24 24" class="svg-icon">
        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
      </svg>
      <span>Home</span>
    </a>
    <a href="#/search" class="bottom-nav-item" data-page="search">
      <svg viewBox="0 0 24 24" class="svg-icon">
        <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <span>Search</span>
    </a>
    <a href="#/history" class="bottom-nav-item" data-page="history">
      <svg viewBox="0 0 24 24" class="svg-icon">
        <path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
      </svg>
      <span>History</span>
    </a>
    <a href="#/playlists" class="bottom-nav-item" data-page="playlists">
      <svg viewBox="0 0 24 24" class="svg-icon">
        <path d="M4 10h12v2H4zm0-4h12v2H4zm0 8h8v2H4zm10 0v6l5-3z"/>
      </svg>
      <span>Playlists</span>
    </a>
    <a href="#/admin" class="bottom-nav-item" data-page="admin">
      <svg viewBox="0 0 24 24" class="svg-icon">
        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/>
      </svg>
      <span>Admin</span>
    </a>
  </nav>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- MODAL CONTAINER (for dialogs, CRUD, playlists) -->
  <div id="modal-container" class="modal-container hidden" role="dialog" aria-modal="true"></div>

  <!-- APPLICATION JAVASCRIPT -->
  <script src="app.js"></script>
</body>
</html>
